<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agente 3D</title>
    <style>
      :root {
        --bg: #07151d;
        --bg-2: #102330;
        --panel: rgba(18, 35, 44, 0.95);
        --panel-border: rgba(123, 208, 255, 0.22);
        --text: #edf8ff;
        --muted: #a5c4d6;
        --accent: #1d91ff;
        --accent-2: #48dbb6;
        --warn: #ffc76b;
        --danger: #ff7d7d;
        --ok: #8af0d8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
        color: var(--text);
      }

      .page-shell {
        max-width: 1100px;
        margin: 36px auto;
        padding: 20px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1.4rem;
        font-weight: 700;
      }

      .brand-mark {
        width: 14px;
        height: 14px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-radius: 4px;
      }

      .badge {
        border: 1px solid var(--panel-border);
        background: rgba(255,255,255,0.02);
        color: var(--muted);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.8rem;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        box-shadow: 0 24px 80px rgba(0,0,0,0.35);
        padding: 28px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(32px, 4vw, 52px);
      }

      .grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 24px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 18px;
      }

      label {
        font-weight: 700;
        color: #dfefff;
      }

      input, select, button {
        width: 100%;
        border-radius: 12px;
        border: 1px solid #2d586b;
        background: #0d1a22;
        color: var(--text);
        padding: 12px 14px;
        font-size: 16px;
      }

      button {
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        border: none;
        cursor: pointer;
        font-weight: 800;
        color: #07151d;
        min-height: 52px;
      }

      .result-box {
        margin-top: 20px;
        background: rgba(8, 17, 22, 0.92);
        border: 1px solid rgba(123, 208, 255, 0.22);
        border-radius: 16px;
        padding: 20px;
      }

      .status {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 700;
      }

      .status.ready { background: rgba(72, 219, 182, 0.18); color: var(--ok); }
      .status.review { background: rgba(255, 182, 71, 0.18); color: var(--warn); }
      .status.repair { background: rgba(255, 93, 93, 0.18); color: var(--danger); }

      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        padding: 14px;
        overflow: auto;
      }

      @media (max-width: 800px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <span>Agente 3D</span>
        </div>
        <span class="badge">Preflight + validation</span>
      </header>

      <main class="panel">
        <h1>Validação de peça 3D</h1>

        <div class="grid">
          <section>
            <form id="upload-form" enctype="multipart/form-data">
              <div class="field">
                <label for="file">Arquivo 3D</label>
                <input id="file" name="file" type="file" accept=".stl,.obj,.3mf" required />
              </div>

              <div class="field">
                <label for="material">Material</label>
                <select id="material" name="material">
                  <option value="PLA">PLA</option>
                  <option value="PETG">PETG</option>
                  <option value="ABS">ABS</option>
                  <option value="ASA">ASA</option>
                </select>
              </div>

              <div class="field">
                <label for="nozzle_mm">Nozzle (mm)</label>
                <input id="nozzle_mm" name="nozzle_mm" type="number" min="0.2" max="1.0" step="0.1" value="0.4" />
              </div>

              <div class="field">
                <label for="profile_name">Perfil</label>
                <input id="profile_name" name="profile_name" type="text" value="Bambu X1C" />
              </div>

              <button type="submit">Validar peça</button>
            </form>
          </section>

          <section>
            <div class="result-box" id="result-box">
              <p>Faça upload de um arquivo STL/OBJ/3MF para validar a sua peça e receber recomendações de impressão.</p>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script>
      const form = document.getElementById('upload-form');
      const resultBox = document.getElementById('result-box');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const formData = new FormData(form);
        const fileInput = formData.get('file');

        if (!fileInput || fileInput.name === '') {
          resultBox.innerHTML = '<p>Selecione um arquivo antes de validar.</p>';
          return;
        }

        resultBox.innerHTML = '<p>Processando peça...</p>';

        try {
          const response = await fetch('/api/process', {
            method: 'POST',
            body: formData
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.detail || 'Erro ao processar o arquivo.');
          }

          const statusClass = data.is_ready ? 'ready' : data.checks?.status === 'REVIEW_REQUIRED' ? 'review' : 'repair';

          resultBox.innerHTML = `
            <span class="status ${statusClass}">${data.checks?.status || 'PROCESSADO'}</span>
            <h3>Resultado da análise</h3>
            <p><strong>Arquivo:</strong> ${data.file_name}</p>
            <p><strong>Score:</strong> ${data.checks?.printability_score ?? 'n/a'}</p>
            <p><strong>Perfil:</strong> ${data.profile?.material || 'N/A'} / ${data.profile?.machine || 'N/A'}</p>
            <h4>Recomendações</h4>
            <ul>
              ${(data.recommendations || []).map(item => `<li>${item}</li>`).join('') || '<li>Nenhuma recomendação adicional.</li>'}
            </ul>
            <h4>Detalhes</h4>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          `;
        } catch (error) {
          resultBox.innerHTML = `<p>Erro: ${error.message}</p>`;
        }
      });
    </script>
  </body>
</html>
